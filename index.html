<!DOCTYPE html>
<html lang="da">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RWJZ8NJB0C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RWJZ8NJB0C');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikerBasen - Danmarks største motorcykelmarkedsplads</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #e5e5e5; color: #333333; }
        
        header { 
            background: white; 
            padding: 1rem 0; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); 
            border-bottom: 1px solid #f0f0f0;
        }
        .header-container { 
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 24px; font-weight: 700; color: #ff6600; text-decoration: none; }
        
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { text-decoration: none; color: #333; font-weight: 500; font-size: 0.95rem; }
        .btn-sell { background: #ff6600; color: white !important; padding: 0.6rem 1.2rem; border-radius: 4px; }

        /* NY STIL TIL POPULÆRE SØGNINGER (CIRKLER) */
        .section { padding: 3rem 0; background: white; margin-top: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; font-weight: 700; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 2rem;
            padding: 1rem 0;
        }

        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .category-card:hover { transform: translateY(-5px); }

        .category-image {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 0.75rem;
            border: 2px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .category-card span {
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }

        /* HERO & ANDRE ELEMENTER */
        .hero { 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&q=80&w=1500');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .hero-content h1 { font-size: 2.5rem; margin-bottom: 1rem; }

        /* Listing Cards */
        .listing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .listing-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .listing-img { width: 100%; height: 180px; object-fit: cover; }
        .listing-details { padding: 1rem; }
        .listing-price { font-size: 1.25rem; font-weight: 700; color: #ff6600; }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">BikerBasen</a>
            <nav class="nav-links">
                <a href="listings.html">Søg MC</a>
                <a href="prisvurdering.html">Prisvurdering</a>
                <a href="signup.html" class="btn-sell">Opret annonce</a>
                <a href="login.html">Log ind</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Find din næste drømme-MC</h1>
            <p>Danmarks hurtigste markedsplads for motorcykler</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <h2 class="section-title">Populære kategorier</h2>
            <div class="category-grid">
                <a href="listings.html?type=Sport" class="category-card">
                    <img src="https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&q=80&w=200" alt="Sport" class="category-image">
                    <span>Sport</span>
                </a>
                <a href="listings.html?type=Cruiser" class="category-card">
                    <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&q=80&w=200" alt="Cruiser" class="category-image">
                    <span>Cruiser</span>
                </a>
                <a href="listings.html?type=Touring" class="category-card">
                    <img src="https://images.unsplash.com/photo-1547623641-82fbb83476e9?auto=format&fit=crop&q=80&w=200" alt="Touring" class="category-image">
                    <span>Touring</span>
                </a>
                <a href="listings.html?type=Cross" class="category-card">
                    <img src="https://images.unsplash.com/photo-1531327374167-0334f59439fd?auto=format&fit=crop&q=80&w=200" alt="Cross" class="category-image">
                    <span>Cross</span>
                </a>
                <a href="listings.html?type=Scooter" class="category-card">
                    <img src="https://images.unsplash.com/photo-1590892019183-42174898160a?auto=format&fit=crop&q=80&w=200" alt="Scooter" class="category-image">
                    <span>Scooter</span>
                </a>
            </div>
        </div>
    </section>

    <section class="section" style="background: #f9f9f9;">
        <div class="container">
            <h2 class="section-title">Nyeste annoncer</h2>
            <div id="latest-listings" class="listing-grid">
                <p>Henter de nyeste motorcykler...</p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase configuration (Brug dine egne keys herfra din eksisterende kode)
        const sb_url = 'https://dxefcvlerxugymjfjgoe.supabase.co';
        const sb_key = 'sb_publishable_05IjuXC5ZJO912AGP-qZ4Q_IujZju7U';
        const sb = window.supabase.createClient(sb_url, sb_key);

        async function loadSupabaseListings() {
            const { data, error } = await sb.from('listings').select('*').limit(4).order('created_at', { ascending: false });
            if (error) return;

            const container = document.getElementById('latest-listings');
            container.innerHTML = data.map(m => `
                <div class="listing-card" onclick="window.location.href='listing-detail.html?id=${m.id}'">
                    <img class="listing-img" src="${m.images ? m.images[0].data : 'https://via.placeholder.com/300'}" alt="${m.brand}">
                    <div class="listing-details">
                        <div class="listing-price">${m.price.toLocaleString('da-DK')} kr.</div>
                        <div style="font-weight:600; margin: 0.5rem 0;">${m.brand} ${m.model}</div>
                        <div style="font-size:0.85rem; color:#666;">${m.year} • ${m.km.toLocaleString('da-DK')} km</div>
                    </div>
                </div>
            `).join('');
        }

        loadSupabaseListings();
    </script>
</body>
</html>
